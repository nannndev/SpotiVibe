name: SpotiVibe
options:
  bundleIdPrefix: com.naneps.spotivibe
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SpotiVibe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SpotiVibe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naneps.spotivibe
        DEVELOPMENT_TEAM: 6HF6B53G32
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: SpotiVibe/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: SpotiVibe/Resources/SpotiVibe.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naneps.spotivibe]
    dependencies:
      - target: SpotiVibeShare
      - target: SpotiVibeWidget
  SpotiVibeShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SpotiVibeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naneps.spotivibe.share
        DEVELOPMENT_TEAM: 6HF6B53G32
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: SpotiVibeShare/Info.plist
    entitlements:
      path: SpotiVibeShare/SpotiVibeShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naneps.spotivibe]
  SpotiVibeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SpotiVibeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naneps.spotivibe.widget
        DEVELOPMENT_TEAM: 6HF6B53G32
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: SpotiVibeWidget/Info.plist
    entitlements:
      path: SpotiVibeWidget/SpotiVibeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naneps.spotivibe]
