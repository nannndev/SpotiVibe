name: SpotiVibe
options:
  bundleIdPrefix: io.github.spotivibe
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SpotiVibe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SpotiVibe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spotivibe
        INFOPLIST_FILE: SpotiVibe/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
